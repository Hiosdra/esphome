esphome:
  name: test-esp32-improv-thread
  friendly_name: Test ESP32 Improv Thread

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

network:
  enable_ipv6: true

mdns:

openthread:
  network_key: 0x00112233445566778899aabbccddeeff
  channel: 15
  pan_id: 0x1234

esp32_ble_server:

esp32_improv_thread:
  authorizer: none
  thread_timeout: 60s
  on_provisioned:
    - logger.log: "Thread network provisioned!"
  on_provisioning:
    - logger.log: "Joining Thread network..."
  on_start:
    - logger.log: "Improv Thread started"
