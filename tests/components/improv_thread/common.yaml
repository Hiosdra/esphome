esphome:
  name: improv-thread-test
  friendly_name: Improv Thread Test

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

network:
  enable_ipv6: true

openthread:
  network_key: 0x00112233445566778899aabbccddeeff

binary_sensor:
  - platform: gpio
    pin: 0
    id: io0_button

output:
  - platform: gpio
    pin: 2
    id: built_in_led

improv_thread:
  authorizer: io0_button
  authorized_duration: 1min
  status_indicator: built_in_led
  next_url: "https://example.com/setup?device={{device_name}}&version={{esphome_version}}"
